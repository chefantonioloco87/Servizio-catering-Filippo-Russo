<!DOCTYPE html>
<html lang="it">
<head>

<title>Filippo Russo Experience</title>

<style>

body{margin:0;font-family:'Montserrat',sans-serif;background:#0b0b0b;color:#f5f5f5}

.section{padding:80px 20px;text-align:center}
.section h2{font-family:'Playfair Display',serif;color:#d4af37}
img{width:90%;max-width:600px;border-radius:10px;margin-top:20px}

</div>

<div class="section">

<div class="section">
<h2>Catering</h2>
<img src="img2.jpg">
