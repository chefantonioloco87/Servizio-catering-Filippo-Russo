<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filippo Russo Catering</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5efe6;
color:#2b2b2b;
}

.section{
padding:80px 20px;
text-align:center;
max-width:1000px;
margin:auto;
}

h1,h2{
color:#7a5c3e;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#f5efe6,#e8dccf);
}

.btn{
margin-top:20px;
padding:12px 25px;
border:1px solid #7a5c3e;
color:#7a5c3e;
text-decoration:none;
}

.card{
background:#fff;
padding:20px;
margin:10px auto;
border-radius:12px;
max-width:400px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:30px;
}

.gallery img{
width:100%;
border-radius:10px;
}

@media(max-width:700px){
.gallery{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<div class="hero">
<h1>Filippo Russo Catering</h1>
<p>Esperienze gastronomiche eleganti</p>
<a class="btn" href="#dinner">Dinner Abend</a>
</div>

<div class="section" id="dinner">
<h2>Dinner Abend</h2>
<div class="card">12 Aprile – SOLD OUT</div>
<div class="card">26 Aprile – Ultimi posti</div>
<div class="card">10 Maggio – Disponibile</div>
</div>

<div class="section">
<h2>Chi è Filippo</h2>
<p>Tradizione, innovazione e passione per la cucina.</p>
</div>

</div>
</div>

<div class="section">
<h2>Contatti</h2>
<p>WhatsApp: +49 170 4651044</p>
</div>

</body>
</html>
